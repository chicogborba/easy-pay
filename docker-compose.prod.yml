# Production on a single VM (e.g. Oracle Cloud Always Free):
#   cp .env.prod.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: easypay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same private Docker network: no TLS needed to reach Postgres.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/easypay?sslmode=disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      OPENROUTER_AUDIO_MODEL: ${OPENROUTER_AUDIO_MODEL:-google/gemini-2.5-flash}
      PORT: 8080
      # Emails that can open /admin (comma-separated).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_URL: https://${DOMAIN}
      # Real payments: leave empty for demo mode. See STRIPE.md.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Platform fee per paid sale (basis points): 150 = 1.5% in Brazil, 100 = 1% elsewhere. Shown on /pricing.
      PLATFORM_FEE_BPS_BR: ${PLATFORM_FEE_BPS_BR:-150}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-100}
      # Brazil: Mercado Pago (see PAYMENTS.md)
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_SANDBOX: ${MP_SANDBOX:-false}
      # Encrypts sellers' payment tokens at rest: set a long random value once and never change it.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Emails (verification, password reset) via resend.com; without a key they go to the logs.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Easy Pay <onboarding@resend.dev>}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-30}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

  # HTTPS with automatic Let's Encrypt certificates (needed for the microphone on phones).
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
